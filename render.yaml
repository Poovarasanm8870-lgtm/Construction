services:
  # 1. Backend Web Service (Django + REST API)
  - type: web
    name: constructai-backend
    env: python
    plan: free
    region: singapore
    buildCommand: "bash ./backend/build.sh"
    startCommand: "cd backend && gunicorn constructai.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true

staticSites:
  # 2. Frontend Static Site (React + Vite + Tailwind)
  - name: constructai-frontend
    plan: free
    region: singapore
    buildCommand: "cd frontend && npm install --legacy-peer-deps && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
